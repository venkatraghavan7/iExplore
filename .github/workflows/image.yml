name: image
# Builds the runner image and pushes it to ECR. Needs vars.AWS_ECR_ROLE_ARN (OIDC role with ECR push)
# and an ECR repository named iexplore in ap-southeast-2.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  id-token: write
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_ROLE_ARN }}
          aws-region: ap-southeast-2
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/iexplore:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/iexplore:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
