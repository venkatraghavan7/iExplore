# The pod's AWS identity. IRSA: put the role ARN in the annotation.
# EKS Pod Identity instead: delete the annotation and create a pod identity association for this service account.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: iexplore
  namespace: iexplore
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/iexplore-runner
